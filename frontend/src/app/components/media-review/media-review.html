<article class="comment">
  <div class="comment__avatar" aria-hidden="true">U</div>
  <div class="comment__body">
    <div class="comment__meta">
      <strong>{{ comment.username || 'Username' }}</strong>
      <span>Bewertung</span>
      @if (canEdit) { <button mat-button type="button" (click)="edit.emit(comment)">Bearbeiten</button> }
      <button *appIsInRoles="['admin']" mat-button type="button" (click)="delete.emit(comment)">Löschen</button>
    </div>
    <p>{{ comment.commentText }}</p>
  </div>
</article>
