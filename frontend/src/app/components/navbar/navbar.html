<nav class="navbar">
  <a class="navbar-brand" routerLink="/media">Videothek</a>

  <ul class="navbar-links">
    <li>
      <a routerLink="/media" routerLinkActive="active">Media</a>
    </li>

    <li *appIsInRoles="['admin']">
      <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
    </li>
  </ul>

  <div class="navbar-actions">
    @if (isAuthenticated()) {
      <span class="navbar-user">{{ useralias || username }}</span>
      <span class="navbar-role-badge" *appIsInRoles="['admin']">admin</span>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <button type="button" (click)="login()">Login</button>
    }
  </div>
</nav>
