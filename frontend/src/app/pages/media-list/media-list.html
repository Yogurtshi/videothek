
<section class="media-list">
  <h1>Medien</h1>

  @if (mediaList().length === 0) {
    <p>Keine Medien gefunden.</p>
  }

  <div class="media-grid">
    @for (item of mediaList(); track item.id) {
      <mat-card class="media-card" [routerLink]="['/media', item.id]">
        <mat-card-header>
          <mat-card-title>
            {{ item.title }}
          </mat-card-title>
          <mat-card-subtitle>{{ item.releaseYear }} · {{ item.director }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <mat-chip-set>
            <mat-chip>{{ item.mediaCategory }}</mat-chip>
          </mat-chip-set>
        </mat-card-content>

        <mat-card-actions align="end">
          <button mat-icon-button aria-label="Bearbeiten" (click)="$event.stopPropagation(); onEdit(item)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button aria-label="Löschen" (click)="$event.stopPropagation(); onDelete(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</section>
