<section class="media-list">
  <h1>Medien</h1>

  @if (mediaList.length === 0) {
    <p>Keine Medien gefunden.</p>
  }

  <ul>
    @for (item of mediaList; track item.id) {
      <li>
        <a [routerLink]="['/media', item.id]">
          {{ item.title }} ({{ item.releaseYear }})
        </a>
      </li>
    }
  </ul>
</section>
